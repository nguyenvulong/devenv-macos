name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck install.sh \
            .config/sketchybar/sketchybarrc \
            .config/sketchybar/*.sh \
            .config/sketchybar/items/*.sh \
            .config/sketchybar/plugins/*.sh

  zsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Check zsh syntax
        run: zsh --no-exec .zshrc

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .config/nvim

  install-script:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        run: HOME="$(mktemp -d)" ./install.sh --no-brew --dry-run
      - name: Link into a temporary home, twice
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --no-brew
          ./install.sh --no-brew | grep -q "ok .*\.vimrc"
          test "$(readlink "$HOME/.config/nvim")" = "$PWD/.config/nvim"
